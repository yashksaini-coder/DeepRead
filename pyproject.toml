[project]
name = "deepread"
version = "0.1.0"
description = "Local, long-context document intelligence with Gemma 4 E4B"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=2.11.1",
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepread"]

[tool.pytest.ini_options]
pythonpath = ["."]
